services:
  mongo:
    image: mongo:7
    container_name: mongo_omixia
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - omixia_mongo_data:/data/db
    networks:
      - omixia_net

  redis:
    image: redis:7-alpine
    container_name: redis_omixia
    restart: unless-stopped
    volumes:
      - omixia_redis_data:/data
    networks:
      - omixia_net

  app:
    build: ./app
    container_name: app_omixia
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./app:/app
      - omixia_reports:${REPORTS_BASE_PATH}
    networks:
      - omixia_net

  nginx:
    image: nginx:alpine
    container_name: nginx_omixia
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - omixia_net

volumes:
  omixia_mongo_data:
  omixia_redis_data:
  omixia_reports:

networks:
  omixia_net:
    name: omixia_net