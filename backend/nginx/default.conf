server {
  listen 80;

  location /api/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # Flask-Cors sets CORS headers; prevent nginx from adding duplicates
    proxy_hide_header Access-Control-Allow-Origin;
  }

  location / {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# React SPA — port 8080 for local dev / testing only
# In production, React is served from Cloudflare Pages.
server {
  listen 8080;
  root /var/www/react;
  index index.html;

  location /api/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Access-Control-Allow-Origin;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
