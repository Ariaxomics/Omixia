{% extends "base.html" %}

{% block content %}

<h2 class="text-3xl font-semibold mb-6">Samples</h2>

<!-- Samples Table -->
<div id="samples-container"
     hx-get="/partials/samples"
     hx-trigger="load"
     hx-target="#samples-container"
     hx-swap="innerHTML">
    Loading samples...
</div>

<!-- Assay Container -->
<div id="assay-container" class="mt-8"></div>

<!-- Variant tabs -->
<div id="variant-tabs-container" class="mt-8 hidden">

    <div class="border-b border-gray-200">
        <nav class="-mb-px flex space-x-6">

            <button onclick="loadTab('snv')" id="tab-snv"
                    class="tab-btn border-b-2 border-blue-500 text-blue-600 px-1 pb-3 text-sm font-medium">
                SNVs
            </button>

            <button onclick="loadTab('cnv')" id="tab-cnv"
                    class="tab-btn border-b-2 border-transparent text-gray-500 hover:text-gray-700 px-1 pb-3 text-sm font-medium">
                CNVs
            </button>

            <button onclick="loadTab('sv')" id="tab-sv"
                    class="tab-btn border-b-2 border-transparent text-gray-500 hover:text-gray-700 px-1 pb-3 text-sm font-medium">
                Fusions / SVs
            </button>

            <button onclick="loadTab('preflight')" id="tab-preflight"
                    class="tab-btn border-b-2 border-transparent text-gray-500 hover:text-gray-700 px-1 pb-3 text-sm font-medium">
                Preflight
            </button>

            <button onclick="loadTab('biomarker')" id="tab-biomarker"
                    class="tab-btn border-b-2 border-transparent text-gray-500 hover:text-gray-700 px-1 pb-3 text-sm font-medium">
                Biomarkers
            </button>

        </nav>
    </div>

    <!-- Single content container -->
    <div id="variant-content" class="mt-6"></div>

</div>

<script>

let currentSampleAssayId = null;

function activateVariantTabs(sampleAssayId) {
    currentSampleAssayId = sampleAssayId;
    document.getElementById('variant-tabs-container').classList.remove('hidden');
    loadTab('snv');  // load default tab
}

function loadTab(name) {

    if (!currentSampleAssayId) return;

    // Update tab styling
    document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('border-blue-500', 'text-blue-600');
        b.classList.add('border-transparent', 'text-gray-500');
    });

    const btn = document.getElementById('tab-' + name);
    btn.classList.remove('border-transparent', 'text-gray-500');
    btn.classList.add('border-blue-500', 'text-blue-600');

    // Load only the selected tab
    htmx.ajax(
        'GET',
        '/partials/sample-assays/' + currentSampleAssayId + '/' + name + 's',
        {
            target: '#variant-content',
            swap: 'innerHTML'
        }
    );
}

</script>

{% endblock %}
