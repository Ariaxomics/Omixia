{% if search_error %}
<div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-3 text-sm mb-3">
    {{ search_error }}
</div>
{% endif %}

{% if not entries %}
<p class="text-gray-400 text-sm text-center py-6">No entries found.</p>
{% else %}
<div class="space-y-2">
{% for e in entries %}
<button class="w-full text-left bg-white rounded-lg shadow-sm border border-gray-200 p-3 hover:border-blue-400 hover:shadow transition"
        hx-get="/partials/knowledge/{{ e.knowledge_id }}"
        hx-target="#entry-detail"
        hx-swap="innerHTML">

    <div class="flex items-start justify-between">
        <div>
            <span class="font-semibold text-gray-900 text-sm">
                {% if e.variant_type == 'snv' %}
                    {{ e.gene }} {{ e.hgvsp }}
                {% elif e.variant_type == 'cnv' %}
                    {{ e.gene }} {{ e.event_type | replace('_', ' ') | title }}
                {% else %}
                    {{ e.gene_5prime }}-{{ e.gene_3prime }}
                {% endif %}
            </span>
            <span class="ml-2 text-xs text-gray-400">{{ e.variant_type | upper }}</span>
        </div>
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full
            {% if e.tier == 'tier_1' %}bg-red-100 text-red-800
            {% elif e.tier == 'tier_2' %}bg-orange-100 text-orange-800
            {% elif e.tier == 'tier_3' %}bg-yellow-100 text-yellow-800
            {% else %}bg-green-100 text-green-800{% endif %}">
            {{ e.tier | replace('_', ' ') | upper }}
        </span>
    </div>

    <div class="mt-1 text-xs text-gray-500">
        {{ e.disease_subtype or e.disease_group | replace('_', ' ') | title }}
        {% if e.observation_count %}· {{ e.observation_count }} obs.{% endif %}
        {% if e.is_contested %}<span class="ml-1 text-amber-600 font-medium">⚠ Contested</span>{% endif %}
    </div>

    {% if e.evidence_tags %}
    <div class="mt-1 flex flex-wrap gap-1">
        {% for tag in e.evidence_tags[:3] %}
        <span class="text-xs px-1.5 py-0.5 bg-blue-50 text-blue-700 rounded">{{ tag | replace('_', ' ') }}</span>
        {% endfor %}
    </div>
    {% endif %}

</button>
{% endfor %}
</div>
{% endif %}
