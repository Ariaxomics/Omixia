{% extends "base.html" %}

{% block content %}

<div class="text-center mt-20">

    <h1 class="text-5xl font-bold text-gray-800 mb-6">
        Omixia
    </h1>

    <p class="text-xl text-gray-600 max-w-3xl mx-auto">
        Omixia is a clinical-grade somatic variant interpretation platform
        designed for SNVs, CNVs, SVs, MSI and TMB analysis.
        Built for precision oncology workflows and geneticist-led review.
    </p>

    <div class="mt-10 space-x-4">
        <a href="{{ spa_base_url }}/samples"
           class="px-6 py-3 bg-blue-700 text-white rounded hover:bg-blue-800 transition-colors font-medium">
            View Samples
        </a>

        <a href="{{ spa_base_url }}/login"
           class="px-6 py-3 bg-white text-blue-700 border border-blue-700 rounded hover:bg-blue-50 transition-colors font-medium">
            Login to Dashboard
        </a>
    </div>

</div>

{% endblock %}
