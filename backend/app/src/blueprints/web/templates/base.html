<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Omixia</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body class="bg-gray-50 min-h-screen">

<nav class="bg-blue-700 text-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex items-center h-14 gap-6">

        <a href="/" class="font-bold text-lg tracking-tight mr-2 hover:opacity-80 transition-opacity">
            Omixia
        </a>

        <a href="{{ spa_base_url }}/samples"     class="text-sm font-medium px-2 py-1 rounded hover:bg-blue-600 transition-colors">Samples</a>
        <a href="{{ spa_base_url }}/knowledge"   class="text-sm font-medium px-2 py-1 rounded hover:bg-blue-600 transition-colors">Knowledge DB</a>
        <a href="{{ spa_base_url }}/cohort"      class="text-sm font-medium px-2 py-1 rounded hover:bg-blue-600 transition-colors">Cohort</a>
        <a href="{{ spa_base_url }}/lab-dashboard" class="text-sm font-medium px-2 py-1 rounded hover:bg-blue-600 transition-colors">Lab Dashboard</a>
        <a href="{{ spa_base_url }}/gap-analysis"  class="text-sm font-medium px-2 py-1 rounded hover:bg-blue-600 transition-colors">Gap Analysis</a>
        <a href="{{ spa_base_url }}/federation"    class="text-sm font-medium px-2 py-1 rounded hover:bg-blue-600 transition-colors">Federation</a>

        <div class="ml-auto flex items-center gap-3 text-sm">
            {% if session.get('user') %}
                <span class="opacity-80">{{ session['user']['full_name'] or session['user']['username'] }}</span>
                <span class="px-2 py-0.5 rounded bg-blue-500 text-xs font-medium capitalize">
                    {{ session['user']['role'] | replace('_', ' ') }}
                </span>
                <a href="{{ spa_base_url }}"
                   class="px-3 py-1 rounded bg-blue-800 hover:bg-blue-900 transition-colors">
                    Dashboard
                </a>
                <form action="/logout" method="post" class="inline">
                    <button type="submit"
                            class="px-3 py-1 rounded bg-blue-800 hover:bg-blue-900 transition-colors">
                        Logout
                    </button>
                </form>
            {% else %}
                <a href="{{ spa_base_url }}/login"
                   class="px-3 py-1 rounded bg-blue-800 hover:bg-blue-900 transition-colors">
                    Login
                </a>
            {% endif %}
        </div>

    </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
</main>

</body>
</html>
